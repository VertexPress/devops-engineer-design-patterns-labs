apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-service
spec:
  replicas: 6
  selector:
    matchLabels: {app: quote-service}
  template:
    metadata:
      labels: {app: quote-service}
    spec:
      containers:
        - name: quote-service
          image: ghcr.io/vertexpress/quote-service@sha256:REPLACE_WITH_DIGEST
          ports: [{containerPort: 8080}]
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: quote-service
spec:
  selector: {app: quote-service}
  ports: [{port: 80, targetPort: 8080}]

apiVersion: v1
kind: ConfigMap
metadata:
  name: quote-service-config
  namespace: quote
data:
  LOG_LEVEL: "info"
  DB_ENDPOINT: "quote-prod.db.internal"
  REQUEST_TIMEOUT_MS: "3000"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quote-service-db
  namespace: quote
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vertex-secret-store
    kind: SecretStore
  target:
    name: quote-service-db
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: prod/quote/db-password

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-provenance
spec:
  rules:
    - name: require-signature-and-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/vertexpress/*"
          attestations:
            - type: https://slsa.dev/provenance/v1

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  metrics:
    - name: success-rate
      interval: 1m
      # Three consecutive failing measurements abort the rollout and
      # shift all traffic back to the stable version.
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{app="quote-service",code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{app="quote-service"}[2m]))
      successCondition: result[0] >= 0.995